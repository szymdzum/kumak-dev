<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <title>How a tool attaches to a running Chrome tab when remote debugging is enabled at chrome://inspect</title>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ff41"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eedb96"/>
    </marker>
  </defs>

  <rect width="700" height="600" fill="#101113"/>

  <rect x="20" y="20" width="250" height="88" rx="8" fill="#16151d" stroke="#00ff41" stroke-width="2"/>
  <text x="145" y="58" fill="#00ff41" font-size="18" font-weight="700" text-anchor="middle">your tool</text>
  <text x="145" y="84" fill="#8b8b8b" font-size="14" text-anchor="middle">bdg, Puppeteer, …</text>

  <line x1="270" y1="64" x2="386" y2="64" stroke="#eedb96" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="328" y="52" fill="#eedb96" font-size="14" text-anchor="middle">1. read</text>

  <rect x="390" y="20" width="290" height="108" rx="8" fill="#16151d" stroke="#eedb96" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="408" y="50" fill="#eedb96" font-size="16" font-weight="700">DevToolsActivePort</text>
  <text x="408" y="80" fill="#e8e8e0" font-size="15">63475</text>
  <text x="408" y="106" fill="#e8e8e0" font-size="15">/devtools/browser/&lt;id&gt;</text>

  <line x1="145" y1="108" x2="145" y2="196" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <text x="158" y="160" fill="#ff6b6b" font-size="14">the old way</text>

  <line x1="535" y1="128" x2="535" y2="196" stroke="#00ff41" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="548" y="168" fill="#00ff41" font-size="14">2. connect</text>

  <rect x="20" y="200" width="660" height="380" rx="12" fill="#16151d" stroke="#2a2a2a" stroke-width="2"/>
  <text x="48" y="236" fill="#8b8b8b" font-size="14">Chrome · your real profile, logged in</text>

  <text x="48" y="284" fill="#8b8b8b" font-size="16" text-decoration="line-through">GET /json/version</text>
  <text x="652" y="284" fill="#ff6b6b" font-size="18" font-weight="700" text-anchor="end">404</text>

  <text x="48" y="326" fill="#8b8b8b" font-size="16" text-decoration="line-through">ws /devtools/page/&lt;id&gt;</text>
  <text x="652" y="326" fill="#ff6b6b" font-size="18" font-weight="700" text-anchor="end">403</text>

  <line x1="48" y1="352" x2="652" y2="352" stroke="#2a2a2a" stroke-width="1.5"/>

  <text x="48" y="392" fill="#e8e8e0" font-size="16" font-weight="700">ws /devtools/browser/&lt;id&gt;</text>
  <rect x="482" y="370" width="170" height="32" rx="16" fill="#101113" stroke="#00ff41" stroke-width="1.5"/>
  <text x="567" y="391" fill="#00ff41" font-size="15" text-anchor="middle">Allow? → ✓</text>

  <text x="48" y="440" fill="#8b8b8b" font-size="14">Target.getTargets</text>
  <rect x="48" y="456" width="250" height="48" rx="8" fill="#101113" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="66" y="486" fill="#8b8b8b" font-size="16">[0] Docs</text>
  <rect x="318" y="456" width="334" height="48" rx="8" fill="#101113" stroke="#00ff41" stroke-width="2"/>
  <text x="336" y="486" fill="#e8e8e0" font-size="16">[1] Checkout · errors</text>
  <text x="318" y="538" fill="#00ff41" font-size="14">3. attachToTarget({ flatten: true })</text>
</svg>
